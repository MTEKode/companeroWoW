<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
<title>Compañero WoW</title>
<style>
/*CSS*/
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="gem" aria-hidden="true"></span>Compañero WoW</div>
  <div class="actions">
    <button id="btn-clear" class="ghost" type="button">Limpiar historial</button>
    <button id="btn-quit" class="ghost danger" type="button">Salir</button>
  </div>
</header>

<main id="chat" aria-live="polite"></main>

<section class="composer">
  <div id="notice" class="notice" hidden></div>
  <div class="row meta-row">
    <label class="shot"><input id="shot" type="checkbox"> Incluir captura</label>
    <span id="thinking" class="thinking" hidden><span class="dots"><i></i><i></i><i></i></span> pensando…</span>
  </div>
  <div class="row input-row">
    <textarea id="input" rows="2" maxlength="4000" placeholder="Pregunta sobre WoW: Forever…"></textarea>
    <button id="send" type="button" aria-label="Enviar">Enviar</button>
  </div>
</section>

<footer id="status" class="status">
  <div class="line"><span id="bridge-dot" class="dot"></span><span id="bridge-text">Comprobando…</span><span id="sv-text" class="sv"></span></div>
  <div id="place" class="place" hidden></div>
  <div id="hints" class="hints"></div>
</footer>

<script>
/*JS*/
</script>
</body>
</html>
